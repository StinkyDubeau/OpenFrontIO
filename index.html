<!doctype html>
<html lang="en" class="h-full preload" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Pressure Atlas — Persistent Strategy</title>
    <link rel="manifest" href="<%- manifestHref %>" />
    <link rel="icon" type="image/svg+xml" href="<%- faviconHref %>" />

    <!-- Preload styles -->
    <style>
      .preload {
        visibility: hidden;
        opacity: 0;
        transition: opacity 0.5s ease-out;
      }

      /* iOS safe area support */
      body {
        padding-top: max(env(safe-area-inset-top), var(--native-safe-top, 0px));
        padding-right: max(
          env(safe-area-inset-right),
          var(--native-safe-right, 0px)
        );
        padding-bottom: max(
          env(safe-area-inset-bottom),
          var(--native-safe-bottom, 0px)
        );
        padding-left: max(
          env(safe-area-inset-left),
          var(--native-safe-left, 0px)
        );
      }

      /* Prevent Playwire bottom rail from affecting flex layout,
         and keep it below the bottom HUD (z-[200]) so it can't cover the control panel */
      [id^="pw-oop-bottom_rail"] {
        position: fixed !important;
        z-index: 150 !important;
      }

      /* Google Funding Choices CCPA link override */
      .fc-dns-link,
      .fc-ccpa-root,
      .fc-consent-root {
        position: fixed !important;
        z-index: 999999 !important;
      }
      .fc-dns-link {
        bottom: 15px !important;
        left: 15px !important;
      }

      /* Ensure full viewport height on iOS */
      html,
      body {
        height: 100%;
        height: -webkit-fill-available;
        min-height: 100%;
        min-height: -webkit-fill-available;
      }

      /* Disable iOS double-tap "smart zoom" on the application shell. UI
         stages own their overflow; the game map owns its gestures. */
      html,
      body {
        touch-action: manipulation;
      }
    </style>

    <!-- SEO -->
    <meta
      name="description"
      content="Pressure Atlas is a persistent multiplayer strategy game played on a living world map."
    />

    <!-- Open Graph -->
    <meta property="og:title" content="Pressure Atlas" />
    <meta
      property="og:description"
      content="Enter a persistent strategic world where territory moves and pressure remains."
    />
    <meta property="og:image" content="<%- gameplayScreenshotUrl %>" />
    <meta property="og:type" content="game" />

    <!-- Injected from Server env -->
    <script>
      window.BOOTSTRAP_CONFIG = {
        gitCommit: <%- gitCommit %>,
        assetManifest: <%- assetManifest %>,
        cdnBase: <%- cdnBase %>,
        gameEnv: <%- gameEnv %>,
        numWorkers: <%- numWorkers %>,
        turnstileSiteKey: <%- turnstileSiteKey %>,
        jwtAudience: <%- jwtAudience %>,
        instanceId: <%- instanceId %>,<%- typeof serverHost !== "undefined" && serverHost ? "\n        serverHost: " + serverHost + "," : "" %>
      };
      document.documentElement.style.setProperty(
        "--background-image-url",
        `url("<%- backgroundImageUrl %>")`,
      );
    </script>

    <!-- CrazyGames SDK -->
    <script
      src="https://sdk.crazygames.com/crazygames-sdk-v3.js"
      async
    ></script>

    <!-- Cloudflare Turnstile -->
    <script
      src="https://challenges.cloudflare.com/turnstile/v0/api.js"
      async
      defer
    ></script>

    <script data-cfasync="false">
      window.ramp = window.ramp || {};
      window.ramp.que = window.ramp.que || [];
      window.ramp.passiveMode = true;
    </script>

    <script>
      window.googletag = window.googletag || { cmd: [] };
      googletag.cmd.push(function () {
        googletag.pubads().set("page_url", "http://openfront.io ");
      });
    </script>

    <!-- Analytics -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=AW-16702609763"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];

      function gtag() {
        dataLayer.push(arguments);
      }

      gtag("js", new Date());
      gtag("config", "AW-16702609763");
    </script>
    <!-- Google tag (gtag.js) -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-WQGQQ8RDN4"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());

      gtag("config", "G-WQGQQ8RDN4");
    </script>
  </head>

  <body
    class="atlas-theme atlas-shell h-full select-none font-sans min-h-screen transition-opacity duration-300 ease-in-out flex flex-row overflow-hidden"
    data-product="pressure-atlas"
  >
    <div id="hex-grid" class="fixed inset-0 -z-50 pointer-events-none">
      <div
        id="background-layer"
        class="absolute inset-x-0 top-0 -bottom-[4cm] bg-cover opacity-30 [filter:brightness(1.0)] dark:[filter:sepia(0.2)_saturate(1.2)_hue-rotate(180deg)_brightness(0.9)]"
        style="
          background-image: var(--background-image-url);
          background-position: center top;
        "
      ></div>
    </div>

    <!-- LEFT SIDEBAR MENU -->

    <div
      id="mobile-menu-backdrop"
      class="atlas-navigation-backdrop in-[.in-game]:hidden hidden pointer-events-none [&.open]:block [&.open]:pointer-events-auto [&.open]:fixed [&.open]:inset-0 [&.open]:z-[40000] transition-opacity"
      role="presentation"
      aria-hidden="true"
    ></div>

    <mobile-nav-bar
      id="sidebar-menu"
      class="atlas-mobile-nav peer [.in-game_&]:hidden z-[40001] fixed left-0 top-0 h-full flex flex-col justify-start overflow-hidden transform -translate-x-full w-[86%] max-w-[360px] [&.open]:translate-x-0"
      role="dialog"
      data-i18n-aria-label="main.menu"
    ></mobile-nav-bar>

    <!-- MAIN CONTENT AREA -->
    <div
      class="atlas-home-frame in-[.in-game]:hidden flex-1 relative overflow-hidden h-full transition-[margin] duration-500 ease-out will-change-[margin-left] flex flex-col"
    >
      <!-- Desktop Top Bar -->
      <desktop-nav-bar></desktop-nav-bar>

      <div
        id="turnstile-container"
        class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-99999"
      ></div>

      <atlas-global-overlays></atlas-global-overlays>

      <!-- Main container with responsive padding -->
      <main-layout class="contents">
        <play-page class="contents"></play-page>
        <atlas-page-deck class="contents"></atlas-page-deck>
      </main-layout>
    </div>

    <!-- Game components -->
    <div id="app"></div>
    <atlas-map-bezel></atlas-map-bezel>

    <atlas-game-hud></atlas-game-hud>

    <!-- Scripts -->
    <script>
      // Remove preload class after everything is loaded
      window.addEventListener("load", function () {
        requestAnimationFrame(() => {
          document.documentElement.classList.remove("preload");
        });
      });

      // Fallback: remove preload class after timeout in case DOMContentLoaded never fires
      setTimeout(function () {
        document.documentElement.classList.remove("preload");
      }, 3000);
    </script>

    <!-- Analytics -->
    <script
      defer
      src="https://static.cloudflareinsights.com/beacon.min.js"
      data-cf-beacon='{"token": "03d93e6fefb349c28ee69b408fa25a13"}'
    ></script>
    <script type="module" src="/src/client/Main.ts"></script>
    <footer>
      <script
        data-cfasync="false"
        async
        src="//cdn.intergient.com/1025558/75940/ramp.js"
      ></script>
    </footer>
  </body>
</html>
